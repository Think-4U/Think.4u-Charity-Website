<!-- Mobile Overlay -->
<div id="overlay" 
     class="fixed inset-0 bg-black/40 backdrop-blur-sm z-30 hidden lg:hidden transition-opacity duration-300" 
     onclick="toggleSidebar()"></div>

<script>
    // Load sidebar stats
    fetch('/api/analytics')
        .then(res => res.json())
        .then(data => {
            document.getElementById('sidebar-donations').textContent = 
                'Rs ' + (data.total_donations || 0).toLocaleString();
            document.getElementById('sidebar-volunteers').textContent = 
                (data.volunteer_count || 0).toLocaleString();
        })
        .catch(err => console.error('Failed to load stats:', err));
</script>
