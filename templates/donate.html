{% extends "base.html" %}
{% block title %}Donate - Think.4U{% endblock %}
{% block content %}

<div class="pt-32 pb-20 bg-gradient-to-b from-slate-50 to-white min-h-screen">

  <!-- Header -->
  <div class="max-w-3xl mx-auto text-center mb-12 px-4">
    <h1 class="text-5xl font-black text-slate-900 mb-4">
      <span class="gradient-text">Support Think.4U</span>
    </h1>
    <p class="text-slate-600 text-lg">
      Your generous donation helps us provide mental health support, education, and community programs that change lives.
    </p>
  </div>

  <!-- Donation Form -->
  <div class="max-w-lg mx-auto bg-white p-10 rounded-3xl shadow-2xl border">

    <h2 class="text-2xl font-bold text-center mb-6">Donor Details</h2>

    <!-- Donor Details -->
    <div class="space-y-4 mb-8">

      <div>
        <label class="font-bold text-slate-700">Full Name</label>
        <input id="donor_name" type="text" required
          value="{{ donor_name or '' }}"
          placeholder="Enter your full name"
          class="w-full p-4 border-2 rounded-xl focus:border-teal-500" />
      </div>

      <div>
        <label class="font-bold text-slate-700">Email</label>
        <input id="donor_email" type="email" required
          value="{{ donor_email or '' }}"
          readonly
          placeholder="Enter your email"
          class="w-full p-4 border-2 rounded-xl bg-slate-100 focus:border-teal-500" />
      </div>

      <div>
        <label class="font-bold text-slate-700">Phone Number</label>
        <input id="donor_phone" type="tel" pattern="[0-9]{10}" required
          placeholder="10 digit mobile number"
          class="w-full p-4 border-2 rounded-xl focus:border-teal-500" />
      </div>

    </div>

    <h2 class="text-2xl font-bold text-center mb-6">Choose Amount</h2>

    <!-- Quick Amount Buttons -->
    <div class="grid grid-cols-4 gap-3 mb-6">
      <button onclick="setAmount(100)" class="amount-btn">₹100</button>
      <button onclick="setAmount(500)" class="amount-btn">₹500</button>
      <button onclick="setAmount(1000)" class="amount-btn">₹1000</button>
      <button onclick="setAmount(5000)" class="amount-btn">₹5000</button>
    </div>

    <input id="amount" type="number" min="10"
      value="{{ amount_display or '' }}"
      placeholder="Enter custom amount (₹)"
      class="w-full p-4 border-2 rounded-xl text-lg mb-6" />

    <button id="payBtn"
      class="w-full bg-teal-600 hover:bg-teal-700 text-white text-xl font-bold py-4 rounded-xl">
      <span id="btnText">Donate Now ❤️</span>
    </button>

    <div class="mt-6 text-center">
      <a href="/donate-upi" class="text-teal-600 font-semibold">
        Or pay via UPI
      </a>
    </div>

  </div>
</div>

<!-- Razorpay -->
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>
function setAmount(val) {
  document.getElementById('amount').value = val;
}

document.getElementById("payBtn").addEventListener("click", async () => {

  const name = donor_name.value.trim();
  const email = donor_email.value.trim();
  const phone = donor_phone.value.trim();
  const amountValue = parseFloat(amount.value);

  if (!name || !email || !phone) {
    await window.showUiAlert("Please fill all donor details.", "warning", "Missing Details");
    return;
  }

  if (!/^\d{10}$/.test(phone)) {
    await window.showUiAlert("Enter valid 10 digit phone number.", "warning", "Invalid Phone");
    return;
  }

  if (isNaN(amountValue) || amountValue < 10) {
    await window.showUiAlert("Minimum donation is Rs 10.", "warning", "Invalid Amount");
    return;
  }

  const amountInPaise = Math.round(amountValue * 100);
  btnText.textContent = "Creating order...";
  payBtn.disabled = true;

  try {
    const res = await fetch("/create-order", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        amount: amountInPaise,
        name,
        email,
        phone
      })
    });

    const order = await res.json();
    if (!order.id) throw new Error(order.error || "Unable to create payment order");

    const options = {
      key: "{{ razor_key }}",
      amount: order.amount,
      currency: "INR",
      order_id: order.id,
      name: "Think.4U",
      description: "Donation",
      handler: function (response) {
        window.location.href =
          `/payment-success?razorpay_payment_id=${response.razorpay_payment_id}` +
          `&razorpay_order_id=${response.razorpay_order_id}` +
          `&razorpay_signature=${response.razorpay_signature}`;
      },
      prefill: {
        name: name,
        email: email,
        contact: phone
      },
      theme: { color: "#0d9488" }
    };

    new Razorpay(options).open();

  } catch (err) {
    await window.showUiAlert(err.message || "Payment initiation failed.", "error", "Payment Failed");
    payBtn.disabled = false;
    btnText.textContent = "Donate Now ❤️";
  }
});
</script>

<style>
.amount-btn {
  padding: 12px;
  background: #ecfeff;
  border-radius: 12px;
  font-weight: bold;
}
</style>

{% endblock %}
