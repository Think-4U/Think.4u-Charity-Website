<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#0f172a;-webkit-font-smoothing:antialiased;">
  <span style="display:none!important;visibility:hidden;opacity:0;color:transparent;height:0;width:0;">{{ preheader }}</span>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f8fafc;padding:32px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;background:#ffffff;border-radius:18px;overflow:hidden;border:1px solid #e2e8f0;box-shadow:0 4px 12px rgba(15,23,42,0.04);">
          <!-- Header -->
          <tr>
            <td style="background:linear-gradient(135deg, #0f172a 0%, #1e293b 100%);padding:28px 24px;text-align:center;">
              <a href="{{ website_url }}" target="_blank" rel="noopener" style="text-decoration:none;display:inline-block;">
                <img src="{{ logo_url }}" alt="{{ organization_name }}" height="64" style="max-width:260px;height:64px;object-fit:contain;border:0;display:block;margin:0 auto;border-radius:6px;">
              </a>
              <div style="color:#94a3b8;font-size:11px;margin-top:10px;letter-spacing:0.12em;text-transform:uppercase;font-weight:600;">{{ organization_name }}</div>
            </td>
          </tr>
          <!-- Main Content -->
          <tr>
            <td style="padding:32px 28px;">
              <h1 style="font-size:22px;margin:0 0 16px;color:#0f172a;font-weight:700;line-height:1.3;">{{ email_title }}</h1>
              <div style="font-size:14px;line-height:1.65;color:#334155;">
                {{ body_html|safe }}
              </div>
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td style="padding:22px 28px;background:#f8fafc;border-top:1px solid #e2e8f0;text-align:center;color:#64748b;font-size:12px;line-height:1.6;">
              <div style="font-weight:600;color:#475569;margin-bottom:4px;">Think.4U Charitable Trust</div>
              <div>Need assistance? Email us at <a href="mailto:info@think4u.org" style="color:#0d9488;text-decoration:none;font-weight:600;">info@think4u.org</a></div>
              <div style="margin-top:8px;font-size:11px;color:#94a3b8;">This is an official transactional message. Please do not share security OTPs or personal credentials.</div>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
