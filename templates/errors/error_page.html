{% extends "base.html" %}
{% block title %}{{ status_code }} - {{ error_title }} | Think.4U{% endblock %}

{% block content %}
<section class="pt-28 pb-20 px-4 min-h-[70vh] flex items-center">
    <div class="max-w-3xl mx-auto w-full">
        <div class="bg-white rounded-3xl border border-slate-200 shadow-xl p-8 md:p-12 text-center">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-red-50 border border-red-200 mb-6">
                <span class="text-2xl font-black text-red-600">{{ status_code }}</span>
            </div>
            <h1 class="text-3xl md:text-4xl font-black text-slate-900 mb-3">{{ error_title }}</h1>
            <p class="text-slate-600 text-lg mb-8">{{ error_message }}</p>

            <div class="flex flex-wrap justify-center gap-3">
                <a href="{{ url_for('index') }}" class="px-5 py-3 rounded-xl bg-slate-900 text-white font-semibold hover:bg-slate-800 transition">Go Home</a>
                <a href="{{ url_for('error_help') }}" class="px-5 py-3 rounded-xl border border-slate-300 text-slate-700 font-semibold hover:bg-slate-100 transition">Error Help</a>
                {% if current_user.is_authenticated %}
                <a href="{{ url_for('dashboard') if not current_user.is_admin else url_for('admin_dashboard') }}" class="px-5 py-3 rounded-xl border border-slate-300 text-slate-700 font-semibold hover:bg-slate-100 transition">Dashboard</a>
                {% else %}
                <a href="{{ url_for('login') }}" class="px-5 py-3 rounded-xl border border-slate-300 text-slate-700 font-semibold hover:bg-slate-100 transition">Login</a>
                {% endif %}
            </div>
        </div>
    </div>
</section>
{% endblock %}
