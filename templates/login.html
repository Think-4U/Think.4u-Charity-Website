{% extends "base.html" %}
{% block title %}Login - Think.4U{% endblock %}

{% block content %}
<section class="min-h-screen flex items-center justify-center px-4 py-16">
    <div class="w-full max-w-lg bg-white rounded-3xl shadow-2xl border border-slate-200 p-8 md:p-10">
        <h1 class="text-3xl md:text-4xl font-black text-slate-900 mb-2">Sign In</h1>
        <p class="text-slate-600 mb-8">Access your dashboard, donations, events, and volunteer updates.</p>

        <form method="POST" action="{{ url_for('login', next=next_page) }}" class="space-y-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="next" value="{{ next_page or '' }}">

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Email</label>
                <input type="email" name="email" required autocomplete="email"
                       class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-blue-500 focus:outline-none"
                       placeholder="you@example.com">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Password</label>
                <input type="password" name="password" required autocomplete="current-password"
                       class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-blue-500 focus:outline-none"
                       placeholder="Enter your password">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Captcha: {{ captcha_question }}</label>
                <input type="text" name="captcha_answer" required
                       class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-blue-500 focus:outline-none"
                       placeholder="Enter answer">
            </div>

            <button type="submit"
                    class="w-full py-3 rounded-xl bg-gradient-to-r from-blue-600 to-sky-600 text-white font-bold hover:from-blue-700 hover:to-sky-700 transition">
                Continue
            </button>
        </form>

        <p class="text-sm text-slate-600 mt-6">
            New here?
            <a href="{{ url_for('signup') }}" class="font-semibold text-blue-600 hover:text-blue-700">Create your account</a>
        </p>
    </div>
</section>
{% endblock %}
