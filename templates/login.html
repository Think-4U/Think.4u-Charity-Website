{% extends "base.html" %}
{% block title %}Login - Think.4U{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-gray-50">
    <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-2xl shadow-2xl border border-gray-100 animate-fadeIn">
        <div class="text-center">
            <!-- Circle with zoomed logo (fills entirely) -->
            <div class="mx-auto h-14 w-14 rounded-full overflow-hidden bg-[#1f0606] flex items-center justify-center shadow-lg">
                <img src="{{ url_for('static', filename='images/logo-black.png') }}" alt="Think.4U Logo" class="w-full h-full object-cover">
            </div>
            <h2 class="text-3xl font-black text-charity-dark tracking-tight mt-4">Welcome Back</h2>
            <p class="mt-2 text-sm text-gray-500">Please sign in to your Think.4U account</p>
        </div>

        <form class="mt-8 space-y-6" method="POST" action="{{ url_for("login") }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            {% if next_page %}
            <input type="hidden" name="next" value="{{ next_page }}">
            {% endif %}
            
            <div class="space-y-4">
                <div>
                    <label for="email" class="block text-sm font-bold text-charity-dark mb-1">Email Address</label>
                    <input id="email" name="email" type="email" required 
                           class="appearance-none block w-full px-4 py-3 border border-gray-300 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-charity-gold focus:border-transparent transition-all" 
                           placeholder="you@example.com">
                </div>

                <div>
                    <label for="password" class="block text-sm font-bold text-charity-dark mb-1">Password</label>
                    <input id="password" name="password" type="password" required 
                           class="appearance-none block w-full px-4 py-3 border border-gray-300 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-charity-gold focus:border-transparent transition-all" 
                           placeholder="••••••••">
                </div>

                <div class="bg-gray-50 p-4 rounded-xl border border-gray-200">
                    <label for="captcha_answer" class="block text-sm font-bold text-charity-dark mb-2">Security Question: <span class="text-charity-gold">{{ captcha_question }}</span></label>
                    <input id="captcha_answer" name="captcha_answer" type="text" required 
                           class="block w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-charity-gold focus:outline-none text-center font-bold"
                           placeholder="Your answer">
                </div>
            </div>

            <button type="submit" 
                    class="w-full py-4 px-4 bg-gray-100 text-charity-dark font-bold rounded-xl shadow-md border border-gray-300 hover:bg-gray-200 transition-all hover:scale-[1.02]">
                Log In
            </button>
        </form>

        <div class="text-center pt-6 border-t border-gray-100">
            <p class="text-sm text-gray-600">
                Don't have an account? 
                <a href="{{ url_for("signup") }}" class="font-bold text-charity-gold hover:underline">Sign up now</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
