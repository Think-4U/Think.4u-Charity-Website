<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <script src="{{ api_script_url }}" async></script>
    <style>
        html,
        body,
        #jitsi-container {
            width: 100%;
            height: 100%;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #0f172a;
            font-family: Arial, sans-serif;
        }
        .meeting-topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 14px;
            background: rgba(15, 23, 42, 0.82);
            color: #fff;
        }
        .meeting-topbar a {
            color: #f8d39b;
            font-weight: 700;
            text-decoration: none;
        }
        .meeting-status {
            position: fixed;
            left: 50%;
            top: 50%;
            z-index: 2;
            max-width: 560px;
            width: calc(100% - 32px);
            transform: translate(-50%, -50%);
            border: 1px solid rgba(248, 211, 155, 0.45);
            border-radius: 8px;
            padding: 18px;
            background: rgba(15, 23, 42, 0.92);
            color: #fff;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="meeting-topbar">
        <strong>{{ title }}</strong>
        <a href="{{ return_url }}">Back</a>
    </div>
    <div id="meeting-status" class="meeting-status">
        {% if jwt_required and not jwt_enabled %}
        Secure meeting token could not be generated. Check Jitsi JWT env and PyJWT installation.
        {% else %}
        Preparing secure meeting...
        {% endif %}
    </div>
    <div id="jitsi-container"></div>

    <script>
        const meetingConfig = {
            domain: {{ domain|tojson }},
            roomName: {{ room_name|tojson }},
            jwt: {{ jwt_token|tojson }},
            displayName: {{ display_name|tojson }},
            email: {{ user_email|tojson }},
            returnUrl: {{ return_url|tojson }},
            directMeetUrl: {{ direct_meet_url|tojson }}
        };

        function launchMeeting(attempt = 0) {
            if (!window.JitsiMeetExternalAPI) {
                if (attempt < 80) {
                    window.setTimeout(() => launchMeeting(attempt + 1), 100);
                    return;
                }
                document.getElementById('meeting-status').textContent = 'Jitsi API could not be loaded. Please refresh or open the meeting again.';
                return;
            }

            const status = document.getElementById('meeting-status');
            status.style.display = 'none';

            const options = {
                roomName: meetingConfig.roomName,
                parentNode: document.querySelector('#jitsi-container'),
                userInfo: {
                    displayName: meetingConfig.displayName,
                    email: meetingConfig.email
                },
                interfaceConfigOverwrite: {
                    filmStripOnly: false,
                    SHOW_JITSI_WATERMARK: false
                },
                configOverwrite: {
                    prejoinPageEnabled: true,
                    startWithAudioMuted: false,
                    startWithVideoMuted: false
                }
            };
            if (meetingConfig.jwt) {
                options.jwt = meetingConfig.jwt;
            }

            const api = new JitsiMeetExternalAPI(meetingConfig.domain, options);
            api.addListener('readyToClose', () => {
                window.location.href = meetingConfig.returnUrl;
            });
        }

        window.addEventListener('load', () => launchMeeting());
    </script>
</body>
</html>
