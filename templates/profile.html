{% extends "base.html" %}
{% block title %}Profile - Think.4U{% endblock %}

{% block content %}
<section class="px-4 py-12 bg-[#f4eadf] min-h-screen">
    <div class="max-w-4xl mx-auto">
        <div class="mb-6">
            <h1 class="text-4xl font-black text-slate-900 mb-2">My Profile</h1>
            <p class="text-slate-700">Update your tax name, email, phone, and address. OTP verification is required before changes are saved.</p>
        </div>

        <div class="bg-white rounded-lg shadow-xl border border-stone-200 p-6">
            <form method="POST" action="{{ url_for('request_profile_update') }}" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="md:col-span-2">
                    <label class="block text-sm font-bold text-slate-700 mb-2">Full Name for Tax / Receipt</label>
                    <input type="text" name="name" value="{{ user_profile.name or '' }}" required
                           class="w-full px-4 py-3 rounded-lg border-2 border-stone-200 focus:border-amber-700 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Email</label>
                    <input type="email" name="email" value="{{ user_profile.email or '' }}" required
                           class="w-full px-4 py-3 rounded-lg border-2 border-stone-200 focus:border-amber-700 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Phone</label>
                    <input type="tel" name="phone" value="{{ user_profile.phone or '' }}" required
                           class="w-full px-4 py-3 rounded-lg border-2 border-stone-200 focus:border-amber-700 focus:outline-none">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-bold text-slate-700 mb-2">Address</label>
                    <textarea name="address" rows="4"
                              class="w-full px-4 py-3 rounded-lg border-2 border-stone-200 focus:border-amber-700 focus:outline-none">{{ user_profile.address or '' }}</textarea>
                </div>
                <div class="md:col-span-2 flex flex-wrap gap-3">
                    <button type="submit" class="px-6 py-3 rounded-lg bg-amber-800 text-white font-bold hover:bg-amber-900">Send OTP & Update</button>
                    <a href="{{ url_for('dashboard') }}" class="px-6 py-3 rounded-lg border border-stone-300 text-slate-700 font-bold">Back to Dashboard</a>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
