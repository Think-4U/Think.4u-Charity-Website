{% extends "base.html" %}
{% block title %}Sign Up - Think.4U{% endblock %}

{% block content %}
<section class="min-h-screen flex items-center justify-center px-4 py-16">
    <div class="w-full max-w-xl bg-white rounded-3xl shadow-2xl border border-slate-200 p-8 md:p-10">
        <h1 class="text-3xl md:text-4xl font-black text-slate-900 mb-2">Create Account</h1>
        <p class="text-slate-600 mb-8">Sign up to donate, volunteer, book appointments, and track your records.</p>

        <form method="POST" action="{{ url_for('signup') }}" class="space-y-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Full Name</label>
                <input type="text" name="name" required
                       class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-blue-500 focus:outline-none"
                       placeholder="Your full name">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Email</label>
                <input type="email" name="email" required autocomplete="email"
                       class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-blue-500 focus:outline-none"
                       placeholder="you@example.com">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Password</label>
                    <input type="password" name="password" required autocomplete="new-password"
                           class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-blue-500 focus:outline-none"
                           placeholder="At least 8 characters">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Confirm Password</label>
                    <input type="password" name="confirm_password" required autocomplete="new-password"
                           class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-blue-500 focus:outline-none"
                           placeholder="Re-enter password">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Account Type</label>
                <select name="role" class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-blue-500 focus:outline-none">
                    <option value="donor">Donor</option>
                    <option value="volunteer">Volunteer</option>
                    <option value="both">Donor + Volunteer</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Captcha: {{ captcha_question }}</label>
                <input type="text" name="captcha_answer" required
                       class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-blue-500 focus:outline-none"
                       placeholder="Enter answer">
            </div>

            <button type="submit"
                    class="w-full py-3 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-bold hover:from-emerald-700 hover:to-teal-700 transition">
                Send Signup OTP
            </button>
        </form>

        <p class="text-sm text-slate-600 mt-6">
            Already have an account?
            <a href="{{ url_for('login') }}" class="font-semibold text-blue-600 hover:text-blue-700">Login</a>
        </p>
    </div>
</section>
{% endblock %}
