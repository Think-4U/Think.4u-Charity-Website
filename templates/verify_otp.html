{% extends "base.html" %}
{% block title %}Verify OTP - Think.4U{% endblock %}

{% block content %}
<section class="min-h-screen flex items-center justify-center px-4 py-16">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl border border-slate-200 p-8">
        <h1 class="text-3xl font-black text-slate-900 mb-2">Verify OTP</h1>
        <p class="text-slate-600 mb-6">
            Enter the 6-digit OTP sent to your email to complete {{ flow }}.
        </p>

        <form method="POST" action="{{ url_for('verify_signup') if flow == 'signup' else url_for('verify_login') }}" class="space-y-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">OTP Code</label>
                <input type="text" name="otp" minlength="6" maxlength="6" required
                       class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 text-center text-2xl tracking-[0.4em] focus:border-blue-500 focus:outline-none"
                       placeholder="123456">
            </div>
            <button type="submit"
                    class="w-full py-3 rounded-xl bg-gradient-to-r from-blue-600 to-sky-600 text-white font-bold hover:from-blue-700 hover:to-sky-700 transition">
                Verify OTP
            </button>
        </form>
    </div>
</section>
{% endblock %}
